name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  pytest:
    name: Pytest (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum in hacs.json, and the newest release. The versions match
          # the pins in pyproject.toml's test-min and test groups.
          - ha: "2026.9.4"
            group: test-min
          - ha: "2026.11.1"
            group: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group ${{ matrix.group }}
      - name: Run tests
        run: python -m pytest -n auto --cov=custom_components.mysa_local --cov-report=term-missing
