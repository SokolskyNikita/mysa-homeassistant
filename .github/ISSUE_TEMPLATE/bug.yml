name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Enable debug logging under Settings → Devices & services → Mysa Local. Record the original settings, reproduce once, then restore them. Download diagnostics from the account entry's ⋮ menu BEFORE reloading or restarting (history is memory-only); disable debug logging and save the offered log. Review both files for personal data before attaching. HTTP acceptance does not confirm a physical change.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State what failed and its impact.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Identify the affected entity or service, thermostat model/firmware, Mysa Local and HA versions, and client version if known. Note whether you are signed in and cloud features are enabled.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe expected and actual results, requested values, original settings, reproduction steps, and the time with timezone. Include what the thermostat physically showed.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: List checks already run and results. Say whether evidence is live, simulated, or app-derived; attach diagnostics downloaded before reload and the reviewed debug log when available.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link source tracker IDs, related issues or PRs, docs, and dependencies. For standalone API or protocol behavior, use mysa-client.
    validations:
      required: false
