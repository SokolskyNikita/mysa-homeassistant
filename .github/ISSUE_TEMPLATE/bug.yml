name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Capture once without a shell or manual API calls:
        1. Settings → Devices & services → Mysa Local → ⋮ → Enable debug logging.
        2. Record original settings. Reproduce once; note the time/timezone, requested values, and actual HA/app/thermostat results.
        3. Restore the original settings, then use the account entry's ⋮ → Download diagnostics BEFORE reloading/restarting (history is memory-only).
        4. Disable debug logging and save the offered log. Review both files for personal data, then attach diagnostics JSON and the debug log here. Integration events are sanitized; HA/third-party logs may still contain personal data.
        HTTP acceptance is not confirmation of a physical change. Please include what you observed on the thermostat.
  - type: input
    id: model
    attributes:
      label: Thermostat model
      description: For example BB-V2-0-L (shown on the device page).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Mysa Local version, Home Assistant version, thermostat firmware.
    validations:
      required: true
  - type: dropdown
    id: cloud
    attributes:
      label: Mysa cloud
      options:
        - Signed in, cloud on
        - Signed in, cloud off
        - Local only (not signed in)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Requested values, actual results, and reproduction time
      description: Include time/timezone, original settings, requested values, and actual HA/app/thermostat results.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics and debug log
      description: Attach the diagnostics JSON downloaded before reload/restart and the log saved when disabling debug logging. Review both for personal data.
      render: text
