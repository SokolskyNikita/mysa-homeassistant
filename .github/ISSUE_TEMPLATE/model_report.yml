name: Model or firmware report
description: Record behavior or validation evidence for a specific Mysa model and firmware.
labels: [hardware-validation]
body:
  - type: markdown
    attributes:
      value: |
        Record the hardware and software versions and original settings. Distinguish a live device observation from app-derived or simulated evidence. Enable debug logging under Settings → Devices & services → Mysa Local; download integration diagnostics from the account entry's ⋮ menu BEFORE reloading or restarting; review all attachments for personal data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Name the model, firmware, and behavior being reported.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Identify the feature and connection path (local HomeKit, cloud, or both). Include Mysa Local and HA versions, client version if known, and original settings. Limit claims to the tested model and firmware.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State expected and actual behavior, requested and observed values, exact reproduction steps, and the observation time with timezone. For a successful test, describe what result should be recorded.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Record the device(s), test method, repeat count or duration, and what HA, the Mysa app, and thermostat showed. Mark evidence as live, simulated, or app-derived, and note limits. Attach sanitized diagnostics downloaded before reload and a reviewed debug log when available.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link source tracker IDs, protocol or integration docs, related issues or PRs, and sanitized diagnostics/logs. Put standalone API or protocol findings in mysa-client.
    validations:
      required: false
