[project]
name = "mysa-homeassistant"
version = "0.9.1"
description = "Unofficial Home Assistant integration for Mysa thermostats; unaffiliated with Mysa. Use at your own risk."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"

[dependency-groups]
# CI tests the oldest and the newest Home Assistant this integration supports.
# Home Assistant 2026.11 ships its own harness, pytest-homeassistant; the
# older pytest-homeassistant-custom-component stops at 2026.10 and cannot
# import 2026.11 (it imports httpx before Home Assistant aliases it to httpx2).
test-common = [
    "mysa-client[homekit,mqtt]==0.4.0",
    "aiohomekit==4.0.1",  # Integration tests use aiohomekit's fake accessories.
]
test = [
    "pytest-homeassistant==2026.11.1",  # Home Assistant 2026.11.1
    "pytest-cov==7.1.0",
    { include-group = "test-common" },
]
test-min = [
    # The minimum in hacs.json is 2026.9.0; this is the last 2026.9 harness.
    "pytest-homeassistant-custom-component==0.13.367",  # Home Assistant 2026.9.4
    { include-group = "test-common" },
]
lint = [
    # mypy checks against the minimum. 2026.11 types flow schemas as probatio
    # and marks the pre-native_ climate names Final, which code that still
    # supports 2026.9 cannot satisfy.
    { include-group = "test-min" },
    "ruff==0.17.0",
    "mypy==2.4.0",
]
dev = [
    { include-group = "test" },
    "colorlog",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# no:respx lets Home Assistant alias httpx before respx imports it.
addopts = "-p no:cacheprovider -p no:respx"
markers = ["mqtt_runtime: run the persistent MQTT background task"]
filterwarnings = [
    "ignore::DeprecationWarning:pycognito.*",
]

[tool.coverage.run]
source = ["custom_components.mysa_local"]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
strict = true
warn_unreachable = true
disallow_any_generics = true
ignore_missing_imports = false
files = ["custom_components/mysa_local"]

[[tool.mypy.overrides]]
module = [
    "custom_components.mysa_local.config_flow",
    "custom_components.mysa_local.flows.subentry",
]
warn_return_any = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# A subset of Home Assistant core's rule set.
select = [
    "A", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E", "F", "FLY", "G", "I", "ICN",
    "INP", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PYI", "RET",
    "RSE", "RUF", "S", "SIM", "SLF", "T20", "TID", "TRY", "UP", "W",
]
ignore = [
    "D202",    # blank line after function docstring (formatter decides)
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "D401",    # noun-phrase docstrings read fine for properties and helpers
    "E501",    # the formatter handles line length
    "ISC001",  # conflicts with the formatter
    "PLC0415", # local imports are used deliberately
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "RUF012",  # HA's _attr_ class attributes
    "S101",    # asserts narrow types, as in HA core
    "TRY003",
    "TRY400",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]
known-third-party = ["homeassistant", "mysa_client"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SLF001", "D103", "S105", "S106", "INP001"]
"tools/**" = ["T201", "INP001", "D100", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
