[project]
name = "mysa-homeassistant"
version = "0.2.1"
description = "Local-first Home Assistant integration for Mysa smart thermostats"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"

[dependency-groups]
test = [
    "pytest-homeassistant-custom-component==0.13.367",  # Home Assistant 2026.9.4
    "aiohomekit==4.0.1",
    "pycognito==2024.5.1",  # only to cross-check our SRP implementation
]
lint = [
    { include-group = "test" },
    "ruff==0.17.0",
    "mypy==2.4.0",
]
dev = [
    { include-group = "test" },
    "colorlog",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore::DeprecationWarning:pycognito.*",
]

[tool.coverage.run]
source = ["custom_components.mysa_local"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
disallow_any_generics = true
ignore_missing_imports = false
files = ["custom_components/mysa_local"]

untyped_calls_exclude = ["aiohomekit"]

[[tool.mypy.overrides]]
module = ["mysa_local.config_flow", "custom_components.mysa_local.config_flow"]
warn_return_any = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# A subset of Home Assistant core's rule set.
select = [
    "A", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E", "F", "FLY", "G", "I", "ICN",
    "INP", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PYI", "RET",
    "RSE", "RUF", "S", "SIM", "SLF", "T20", "TID", "TRY", "UP", "W",
]
ignore = [
    "D202",    # blank line after function docstring (formatter decides)
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "D401",    # noun-phrase docstrings read fine for properties and helpers
    "E501",    # the formatter handles line length
    "ISC001",  # conflicts with the formatter
    "PLC0415", # local imports are used deliberately
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "RUF012",  # HA's _attr_ class attributes
    "S101",    # asserts narrow types, as in HA core
    "TRY003",
    "TRY400",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]
known-third-party = ["homeassistant"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SLF001", "D103", "S105", "S106", "INP001"]
"tools/**" = ["T201", "INP001", "D100", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
